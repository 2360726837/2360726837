<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Giriş</title>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.popup {
  background: #111;
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 320px;
  box-shadow: 0 0 15px rgba(255,255,255,0.1);
  box-sizing: border-box;
}

.popup input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 6px;
  border: none;
  background: #222;
  color: #fff;
  font-size: 16px;
  box-sizing: border-box;
  text-align: center;
}

.popup input:focus {
  outline: 1px solid #1e88e5;
}

.popup-buttons {
  margin-top: 20px;
}

button {
  background: #1e88e5;
  border: none;
  padding: 12px 25px;
  font-size: 16px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: #1565c0;
}

.footer {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background-color: #222;
    color: #fff;
    text-align: center;
    padding: 10px 0;
}
</style>
</head>

<body>

<div class="popup" id="popupBox">
  <div>Şifreyi Girin</div>
  <input type="password" id="sifreInput" placeholder="Şifre" onkeypress="handleKeyPress(event)">
  <div class="popup-buttons">
    <button onclick="kontrolEt()">Onayla</button>
  </div>
</div>

<div class="footer">Powered by 🅲𝕠𝕕𝕖🆂</div>

<script>
const popupBox = document.getElementById("popupBox");

function sifreEkraniniYukle() {
  popupBox.innerHTML = `
    <div>Şifreyi Girin</div>
    <input type="password" id="sifreInput" placeholder="Şifre" onkeypress="handleKeyPress(event)">
    <div class="popup-buttons">
      <button onclick="kontrolEt()">Onayla</button>
    </div>`;
  document.getElementById("sifreInput").focus();
}

function handleKeyPress(event) {
  if (event.key === "Enter") {
    kontrolEt();
  }
}

function kontrolEt() {
  const sifre = document.getElementById("sifreInput").value;

  if (sifre === "1453") {
    window.location.href = "Vardiya_2.4.apk";
  } else {
    
    popupBox.innerHTML = `
      <div style="color: #ff5252; font-weight: bold;">Şifre yanlış!</div>
      <div class="popup-buttons">
        <button onclick="sifreEkraniniYukle()">Tekrar Dene</button>
      </div>`;
  }
}

window.onload = function() {
  document.getElementById("sifreInput").focus();
};
</script>

</body>
</html>
