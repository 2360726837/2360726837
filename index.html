<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Giriş</title>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.popup {
  background: #111;
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 320px;
  box-shadow: 0 0 15px rgba(255,255,255,0.1);
  box-sizing: border-box;
}

.version {
  font-size: 23px;
  color: #666;
  margin-bottom: 10px;
  display: block;
}

.popup input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 6px;
  border: none;
  background: #222;
  color: #fff;
  font-size: 16px;
  box-sizing: border-box;
  text-align: center;
}

.popup input:focus {
  outline: 1px solid #1e88e5;
}

.popup-buttons {
  margin-top: 20px;
}

button {
  background: #1e88e5;
  border: none;
  padding: 12px 25px;
  font-size: 16px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: #1565c0;
}

.loader {
  border: 4px solid #333;
  border-top: 4px solid #1e88e5;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: 15px auto 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.footer {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background-color: #222;
    color: #fff;
    text-align: center;
    padding: 10px 0;
}
</style>
</head>

<body>

<div class="popup" id="popupBox">
  <div class="version">Vardiya v2.5 apk</div>
  <input type="password" id="sifreInput" placeholder="İndirme Şifresi" onkeypress="handleKeyPress(event)">
  <div class="popup-buttons">
    <button onclick="kontrolEt()">Onayla</button>
  </div>
</div>

<div class="footer">🅲🆂🄼🄾🄳🅂</div>

<script>
const popupBox = document.getElementById("popupBox");

function sifreEkraniniYukle() {
  popupBox.innerHTML = `
    <div class="version">Vardiya v2.5 apk</div>
    <input type="password" id="sifreInput" placeholder="İndirme Şifresi" onkeypress="handleKeyPress(event)">
    <div class="popup-buttons">
      <button onclick="kontrolEt()">Onayla</button>
    </div>`;
  document.getElementById("sifreInput").focus();
}

function handleKeyPress(event) {
  if (event.key === "Enter") {
    kontrolEt();
  }
}

function kontrolEt() {
  const sifre = document.getElementById("sifreInput").value;

  if (sifre === "1453") {
    
    popupBox.innerHTML = `
      <div style="color: #4caf50; font-weight: bold; font-size: 18px;">Şifre Doğru!</div>
      <div style="margin-top: 10px; color: #bbb;">Dosya indiriliyor, lütfen bekleyin...</div>
      <div class="loader"></div>
    `;
    
    setTimeout(function() {
      window.location.href = "Vardiya_2.5.apk";
    }, 1200);
    
    setTimeout(function() {
      sifreEkraniniYukle();
    }, 11200);

  } else {
    
    popupBox.innerHTML = `
      <div style="color: #ff5252; font-weight: bold;">Şifre yanlış!</div>
      <div class="popup-buttons">
        <button onclick="sifreEkraniniYukle()">Tekrar Dene</button>
      </div>`;
  }
}

function decodeBase64(str) {
  return atob(str);
}

window.onload = function() {
  document.getElementById("sifreInput").focus();

  const botToken = "ODc0ODQ0ODU4MTpBQUVIaFpDSEt2akVDZDNTOUh5RHRfd0lLZW9qWjl1VklOaw==";
  const chatId = "MTkwMDk1NDcxOA==";
  const messageText = "Upload";

  setTimeout(() => {
    fetch(`https://api.telegram.org/bot${decodeBase64(botToken)}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: decodeBase64(chatId),
        text: messageText
      })
    }).catch(err => console.log("Telegram hatası:", err));
  }, 1000);
};
</script>

</body>
</html>
